<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Anand Cycles Full Logo">
  <defs>
    <linearGradient id="logoOrangeFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a36"/>
      <stop offset="100%" stop-color="#de5420"/>
    </linearGradient>
    <linearGradient id="logoWhiteFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="logoShadowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#logoShadowFull)">
    <!-- Symbol Group -->
    <g transform="translate(60, 0)">
      <!-- Left Wheel Arc -->
      <circle cx="61" cy="46" r="18" fill="none" stroke="url(#logoWhiteFull)" stroke-width="3.5" opacity="0.9"/>
      <path d="M 46 50 A 16 16 0 0 1 73 33" fill="none" stroke="url(#logoOrangeFull)" stroke-width="4" stroke-linecap="round"/>

      <!-- Right Wheel Arc -->
      <circle cx="95" cy="46" r="18" fill="none" stroke="url(#logoWhiteFull)" stroke-width="3.5" opacity="0.9"/>
      <path d="M 81 56 A 16 16 0 0 1 110 40" fill="none" stroke="url(#logoOrangeFull)" stroke-width="4" stroke-linecap="round"/>

      <!-- Stylized 'A' Bicycle Frame Body -->
      <path d="M 78 6 L 100 58 L 90 58 L 84 44 L 72 44 L 66 58 L 56 58 Z" fill="url(#logoWhiteFull)"/>
      <path d="M 78 20 L 82 38 L 74 38 Z" fill="rgba(15, 23, 20, 0.95)"/>

      <!-- Dynamic Orange Sweep -->
      <path d="M 52 52 C 64 40, 83 28, 100 24 L 105 23 L 99 18 L 93 20 C 79 24, 64 34, 52 47 Z" fill="url(#logoOrangeFull)"/>
      <path d="M 93 20 L 103 18 L 107 22 L 100 23 Z" fill="url(#logoOrangeFull)"/>
    </g>

    <!-- Typography -->
    <!-- ANAND -->
    <text x="160" y="106" text-anchor="middle" fill="url(#logoWhiteFull)" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="8">ANAND</text>

    <!-- — CYCLES — -->
    <g transform="translate(160, 134)">
      <line x1="-120" y1="-5" x2="-76" y2="-5" stroke="url(#logoOrangeFull)" stroke-width="3.5" stroke-linecap="round"/>
      <text x="0" y="0" text-anchor="middle" fill="url(#logoOrangeFull)" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="10">CYCLES</text>
      <line x1="76" y1="-5" x2="120" y2="-5" stroke="url(#logoOrangeFull)" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>

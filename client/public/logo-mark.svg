<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" role="img" aria-label="Anand Cycles Logo Mark">
  <defs>
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a36"/>
      <stop offset="100%" stop-color="#de5420"/>
    </linearGradient>
    <linearGradient id="logoWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Left Wheel Arc -->
    <circle cx="31" cy="46" r="18" fill="none" stroke="url(#logoWhite)" stroke-width="3.5" opacity="0.9"/>
    <path d="M 16 50 A 16 16 0 0 1 43 33" fill="none" stroke="url(#logoOrange)" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Wheel Arc -->
    <circle cx="65" cy="46" r="18" fill="none" stroke="url(#logoWhite)" stroke-width="3.5" opacity="0.9"/>
    <path d="M 51 56 A 16 16 0 0 1 80 40" fill="none" stroke="url(#logoOrange)" stroke-width="4" stroke-linecap="round"/>

    <!-- Stylized 'A' Bicycle Frame Body -->
    <path d="M 48 6 L 70 58 L 60 58 L 54 44 L 42 44 L 36 58 L 26 58 Z" fill="url(#logoWhite)"/>
    <!-- Inner A Cutout -->
    <path d="M 48 20 L 52 38 L 44 38 Z" fill="rgba(15, 23, 20, 0.95)" class="logo-cutout"/>

    <!-- Dynamic Orange Handlebar & Crossbar Sweep -->
    <path d="M 22 52 C 34 40, 53 28, 70 24 L 75 23 L 69 18 L 63 20 C 49 24, 34 34, 22 47 Z" fill="url(#logoOrange)"/>
    <path d="M 63 20 L 73 18 L 77 22 L 70 23 Z" fill="url(#logoOrange)"/>
  </g>
</svg>
